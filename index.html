<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Scanner</title>
    <script>
        async function scanAndAdd() {
            try {
                const barcode = await scanBarcode();
                if (barcode) {
                    const productInfo = await fetchProductInfo(barcode);
                    if (productInfo) {
                        openScanResult(productInfo);
                    } else {
                        alert('Product not found.');
                    }
                } else {
                    alert('No barcode scanned.');
                }
            } catch (error) {
                console.error('Error scanning barcode:', error);
                alert('Error scanning barcode.');
            }
        }

        async function scanBarcode() {
            // Simulate barcode scanning
            return '1234567890123'; // Replace with actual barcode scanning logic
        }

        async function fetchProductInfo(barcode) {
            try {
                const response = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.json();
                if (data.product && data.product.product_name) {
                    return data.product;
                } else {
                    return null;
                }
            } catch (error) {
                console.error('Error fetching product info:', error);
                return null;
            }
        }

        function openScanResult(productInfo) {
            alert(`Product Name: ${productInfo.product_name}\nBrand: ${productInfo.brands}\nNutriscore: ${productInfo.nutriscore_grade}`);
        }
    </script>
</head>
<body>
    <button onclick="scanAndAdd()">Scan Barcode</button>
</body>
</html>
